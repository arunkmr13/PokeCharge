name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Set display mode to …
        2. Plug in on a wireless pad
        3. …
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 10, Android 16
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 1.0.0
  - type: dropdown
    id: charger
    attributes:
      label: Charger
      options: [Cable, Wireless pad, Dock, Not relevant]
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Optional. `adb logcat` output or screenshots.
      render: shell
