version: 2
updates:
  # Library updates, once a month, grouped so there's at most one PR per group.
  # Build-tool upgrades (Android Gradle plugin, Kotlin, KSP, Gradle) are left out:
  # they tend to break the build and are done by hand.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "com.android.application"
      - dependency-name: "com.android.tools.build:gradle"
      - dependency-name: "org.jetbrains.kotlin*"
      - dependency-name: "com.google.devtools.ksp*"
      - dependency-name: "gradle-wrapper"
    groups:
      androidx:
        patterns: ["androidx.*"]
      others:
        patterns: ["*"]
        exclude-patterns: ["androidx.*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
